# Keeps the free Render API awake (it sleeps after 15 idle minutes and takes about a minute to wake), so the
# demo link never opens on a sleeping server. Also warms the Vercel route that forwards /api to Render.
name: keep-warm
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the API and the site
        run: |
          for url in https://farmsight-api-auat.onrender.com/health                      https://aicon-claude-s-plan-bay.vercel.app/api/meta; do
            curl -s -m 90 -o /dev/null -w "%{http_code} %{time_total}s $url
" "$url" || true
          done
